<style>

.ra{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:500 .85rem Inter,sans-serif;border:1px solid var(--brand);color:var(--brand);background:none;border-radius:99px;padding:6px 14px;cursor:pointer;transition:background .15s,color .15s}

.cap{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}

.cap summary::-webkit-details-marker{display:none}
.cap summary:after{content:"+";float:right;color:var(--mute);font-weight:400}

.cap summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:10px}
.art{padding:12px 16px;border-top:1px solid var(--soft)}

.tb.prv td:first-child{color:var(--ink)}
.note{color:var(--mute);font-size:.82rem;margin:20px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button+button{background:var(--soft);color:var(--ink)}

.dp-cp.ok{color:#0a7a3b}
.dp-ft{margin:36px 0 0;text-align:center;font:500 .7rem Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.dp-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;font:500 .85rem Inter,sans-serif;padding:10px 16px;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);transition:opacity .2s,transform .25s var(--e)}
.dp-toast.sh{opacity:1;transform:translate(-50%,0)}
.dp.on .rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--e),transform .6s var(--e);transition-delay:var(--d,0s)}
.dp.on .rv.in{opacity:1;transform:none}
@media(max-width:360px){.dp-in{grid-template-columns:1fr}.dp-ph{width:140px;margin:0 0 14px}}
@media(prefers-reduced-motion:reduce){.dp *,.dvbn:after{transition:none!important;animation:none!important}.dp.on .rv{opacity:1;transform:none}}
.fm{display:grid;gap:14px}
.fm label{display:block;margin:0 0 4px;font-size:.8rem;color:var(--mute)}
.fm select,.fm input{width:100%;margin:0;padding:13px 14px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px}
.fm select:disabled{opacity:.5}
.pb{border:0;border-radius:12px;background:var(--brand);color:#fff;font:600 .95rem Inter,sans-serif;padding:14px;cursor:pointer;width:100%;margin-top:4px}
.pb:disabled{opacity:.4;cursor:default}
.lk{all:unset;cursor:pointer;color:var(--brand);font-size:.88rem;text-decoration:underline;text-align:center}
.fm .lk{display:block}
.ns{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px}
.ns .big{font:600 2.2rem/1 Inter,sans-serif;letter-spacing:-.03em;color:var(--navy)}
.ns small{display:block;margin-top:6px;color:var(--mute);font-size:.8rem}
.ns .st{text-align:right;font-size:.85rem;line-height:1.4;max-width:60%}
.sb{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px}
.sb summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none;font-weight:600}
.sb summary::-webkit-details-marker{display:none}
.sb summary:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:14px}
.sb summary .v{margin-left:auto;font-weight:600}
.sb summary:after{content:"›";color:var(--mute);font-weight:400;transition:transform .15s}
.sb[open] summary:after{transform:rotate(90deg)}
.sbd{padding:0 16px 14px}
.tr{padding:12px 0;border-top:1px solid var(--soft)}
.th{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:.82rem;color:var(--mute)}
.th b{font-size:.95rem;color:var(--ink);font-weight:600}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g label{display:block;margin:0 0 3px;text-align:center;font-size:.68rem;color:var(--mute)}
.g input{width:100%;margin:0;padding:10px 0;text-align:center;font:inherit;background:var(--bg);border:1px solid transparent;border-radius:10px}
.g input.pp{background:var(--tint)}
.g input:focus{background:#fff;border-color:var(--navy)}
.g input.bad{border-color:var(--brand)}
.ft{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--soft);font-size:.88rem;color:var(--mute)}
.ft b{color:var(--ink)}
.ft button{all:unset;cursor:pointer;color:var(--brand);font-size:.85rem}
.tl{display:flex;justify-content:center;gap:20px;margin:22px 0 0}
.tl button{all:unset;cursor:pointer;color:var(--mute);font-size:.85rem;text-decoration:underline}
.hw{margin:16px 0 0;color:var(--mute);font-size:.82rem}
.hw summary{cursor:pointer;text-align:center}
.hw p{margin:10px 0 0}
header{position:relative}
.eub{all:unset;box-sizing:border-box;position:absolute;top:8px;right:0;width:54px;height:54px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 6px 14px rgba(10,31,77,.25);font:600 .68rem/1 Inter,sans-serif;transition:transform .15s}
.eub svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eub:active{transform:scale(.95)}
.eub:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.eub[aria-current]{background:linear-gradient(135deg,#ff1226,#a50816)}
@media(max-width:420px){.logo{height:72px}}
@media(max-width:375px){.logo{height:64px}}
@media(max-width:340px){.logo{height:54px}}
</style>

const REGULAMENTO=[{"t":"Capítulo I - Disposições Gerais","a":[{"t":"Secção I - Disposições Gerais","x":"O trabalho educativo na formação integral do estudante contribui a elevar a formação de um profissional de acordo com às exigências que demanda a sociedade actual da nossa província e o País em geral, o Instituto Politécnico Privado “Sócrates” (IPPS) estabelece o presente regulamento para todos os estudantes, professores, funcionários, pais e encarregados de educação, sendo este de obrigatório cumprimento, já que em ele estabelecem-se normas que permitem o alcance dos objectivos previstos no ensino, pelo que resulta necessário estabelecer as regras que regem esta actividade.\nO regulamento foi concebido como ferramenta que ajuda a comunidade académica para uniformizar a sua actuação, visando proporcionar um ambiente escolar sadio, baseado na formação moral e cívica, o respeito recíproco entre a Direcção, Professores, Alunos, pais, encarregados de educação e demais Utentes que solicitem nossos serviços, assim como no sentido de pertença, cuidado aos bens patrimoniais da Instituição."},{"t":"Artigo 1.º - Objecto","x":"O presente regulamento tem como objectivo estabelecer e definir o sistema de funcionamento do IPPS, de cada um dos seus órgãos de gestão, administração e das estruturas de coordenação educativa e supervisão pedagógica, os deveres, direitos, obrigações e proibições que regem a actividade escolar, a partir das prioridades de nossa educação e a experiência acumulada na aplicação dos regulamentos internos assim lograr que os estudantes e colectivos de trabalhadores tenha conhecimento das mesmas e o dever de cumprir cabalmente com estes em arieas de fortalecer a disciplina assim como o alcance dos objectivos geral do ensino técnico profissional e do Ministério da Educação."},{"t":"Artigo 2.º - Âmbito de aplicação","x":"O presente Regulamento Interno aplica-se no IPPS, à todos os seus órgãos, estruturas e serviços, bem como a toda a comunidade educativa: pessoal docente, pessoal não docente, aluno, pais e encarregados de educação e a todos os cidadãos que, de uma forma ou outra, possam utilizar os serviços e instalações escolares."},{"t":"Artigo 4.º - Objectivos","x":"O IPPS no âmbito do seu funcionamento, pretende alcançar os seguintes objectivos:\na) Oferecer um ensino de qualidade, de modo a formar quadros competentes, capazes de corresponder as exigências no mercado de trabalho;\nb) Promover o sucesso e prevenir o abandono escolar dos alunos e desenvolver a qualidade de educação, em geral, e das aprendizagens e dos resultados escolares, em particular;\nc) Promover a equidade social, criando condições para a concretização da igualdade de oportunidades para todos;\nd) Assegurar as melhores condições de estudo e de trabalho, de realização e de desenvolvimento pessoal e profissional."}]},{"t":"Capítulo II - Comunidade Educativa (Secção III - Regime de Frequência e Assiduidade)","a":[{"t":"Artigo 12.º - Início das actividades pedagógicas","x":"Os estudantes deverão comparecer as aulas e as outras actividades pedagógicas a hora marcada para o seu início, segundo o horário instituído."},{"t":"Artigo 13.º - Frequência às aulas","x":"1. O regime de frequência dos alunos às aulas é obrigatório com presencia de segunda a sexta-feira, com seis tempos em cada período, início do período manhã 07h, o fim 12h10m, período tarde inicia 13h o fim 18h10m;\n2. O início do cada período terá uma tolerância de 10m para o primeiro tempo, não tendo nenhuma tolerância os tempos subseguistes, (manhã inica 07h, tolerância até 07h10, período tarde inicia 13h tolerância até 13h10)\n3. A Direção revoga e reserva o dereito em termos educativos (educar em puntualidade) retira os 10m de tolerância para o III Trimestre do Ano Lectivo em curso.\n4. Os pais e encarregados de educação dos alunos menores de idades são responsáveis conjuntamente com estes pelo cumprimento dos deveres de frequências pontual e assiduidade às aulas.\n5. O dever de assiduidade implica para alunos:\na) A presença na sala de aula e demais locais onde se desenvolva o trabalho escolar pontualmente;\nb) Uma atitude de empenho intectaul e comportamental adequada, de acordo com a sua idade, aos processo de ensino e aprendizagem."},{"t":"Artigo 14.º - Marcação de faltas","x":"1. Aos estudantes que cheguem atrasados as aulas e as outras actividades pedagógicas fora dos limites de tolerância fixada será marcada falta.\n2. Os estudantes deverão permanecer nas aulas e demais actividades de carácter obrigatório durante todo o tempo que as mesmas durem, só sendo permitidas a sua saída por motivos de força maior perfeitamente justificáveis, aceites pelo professor e autorizado pela direcção, caso contrário ser-lhes-á marcada falta.\n3. A falta conste na ausência do aluno a uma aula ao a outra actividade de frequência obrigatória, devendo a mesma ser registado no livro de ponto, na caderneta do aluno e da caderneta do professor, pelo professor.\n4. O estudante que não compareça ás actividades escolares obrigatórios deverão justificar as respectivas faltas num prazo de 72h (três dias uteis a contar da data que iniciou a falta)."},{"t":"Artigo 15.º - Faltas de material","x":"1. Se o aluno não se fizer acompanhar do material necessário às actividades escolares, definido pela Direcção do Instituto, deverá ser marcada falta de material.\n2. A falta de material considera-se falta de presença.\n3. A direcção do Instituto acompanha os efeitos pedagógicos das faltas de material, mais será da responsabilidade dos professores a aplicação, controlo é informação das mesmas."},{"t":"Artigo 16.º - Faltas disciplinares","x":"1. As faltas disciplinares são as marcadas pelo professor resultantes do mau comportamento do aluno na sala de aulas e que implica a expulsão da sala de aula, e só é permitida quando, pelo seu procedimento, o aluno impossibilite o normal decorrer, da aula e deve ser comunicada por escrito ao director de turma e aos encarregado de educação pelo director de turma.\n2. A marcação de duas faltas disciplinares, no decorrer do trimestre, a um aluno implica a apreciação do comportamento disciplinar do aluno nos termos do constante no artigo ARTIGO 32 (INFRACÇÕES) e seguintes deste regulamento.\n3. A marcação de mais de quatro faltas disciplinares ao aluno num trimestre do ano lectivo implica a exclusão de frequência no trimestre nessa disciplina no referido trimestre."},{"t":"Artigo 17.º - Faltas justificadas","x":"1. Constituem motivos de justificação de faltas, os factores não dependentes da vontade dos estudantes, que impeçam a sua comparência as aulas e outras actividades obrigatórias, tais como:\na) Doença do aluno, devidamente comprovada por documento emitido, assinado e carimbado pela instituição de saúde que fez o atendimento (Justificativo de Faltas);\nb) Impedimentos por razões laborais param os estudantes trabalhadores, devidamente comprovadas documentalmente;\nc) Falecimento de familiar (Mãe, Pai, Avo, Tio, Irmão, Filio, Mulher, Marido, Sogros), durante o período legalmente previsto para os funcionários públicos;\nd) Participação em provas desportivas ou eventos culturais devidamente autorizados pela direcção do instituto;\ne) Participação em actividades associativas, nos termos da lei e devidamente autorizadas pela direcção do instituto;\nf) Cumprimento de obrigações legais, com a apresentação da documentação acreditaria do dito processo;\ng) Outro facto impeditivo da presença na escola, desde que, comprovadamente, não seja imputável ao aluno ou seja, justificadamente, considerado atendível pelo directo da Instituição.\n2. As faltas dadas a aulas intercaladas não terão justificação, salvo em casos excepcionais devidamente comprovadas pela Direcção da Instituição."},{"t":"Artigo 18.º - Justificação de faltas","x":"1. A justificadas das faltas é reponsabilidade dos pais e encarregados de educação ou quando maior de idade, pelo aluno ao director da Instituição.\n2. A justificação é apresentada por escrito em modelo próprio da Instituição, com indicação do dia e das aulas em que a falta se verificou, referenciando os motivos da mesma, deverá ajuntar documentação plausivel (justificativo médico, ou boletim de óbito).\n3. O director da Instituição pode solicitar os comprovativos adicionais que entenda necessários à justificação da falta.\n4. A justificação da falta deve ser apresentada previamente na Secretaria Geral, sendo o motivo previsível ou nos restantes casos, até 72 horas contadas a partir da data do primer dia de falta.\n5. Quando não for apresentada justificação ou quando a mesma não for aceite, deve tal facto ser comunicado, no prazo de cinco de dias úteis, aos pais e encarregados de educação ou quando maior de idade, aos alunos, pelo director de turma."},{"t":"Artigo 19.º - Faltas injustificadas","x":"As faltas são injustiçadas quando para elas não tenha sido apresentada justificação, o quando a justificação apresentada tenha sido fora do prazo ou não tenha sido aceite, ou quando a marcação tenha decorrido da ordem de saída da sala de aula."},{"t":"Artigo 20.º - Limite de faltas injustificadas","x":"1. O número máximo de faltas justificadas no Trimestre não pode exceder o duplo do número de tempos semanais;\n2. Quando as faltas foram injustificadas não pode exceder o 50% do duplo do número de tempos semanais;\n3. Quando for atingida metade do limite de faltas injustificadas. Os pais e encarregados de educação ou, quando maior de idade os alunos são convocados, pelo o professor da disciplina, pelo director de turma com o objectivo de alertar as consequências da situação e de se encontrar uma solução, que permite garantir o cumprimento efectivo do dever de frequência."},{"t":"Artigo 21.º - Efeitos do excesso do limite de faltas injustificadas","x":"1. Quando foram ultrapassados os números máximos de faltas justificadas no Trimestre o caso será avaliado pela direção do instituto para decidir o jeito de actuação;\n2. Ultrapassado o limite de faltas injustificadas numa disciplina implica a exclusão de realização de Prova nesta disciplina.\n3. Quando foram ultrapassados os limites de faltas injustificadas em todas as disciplinas implica a exclusão de frequência a todas as disciplinas."},{"t":"Artigo 22.º - Competência para a justificação de faltas","x":"Compete ao Subdirector Pedagógico de conjunto com o Secretário Pedagógico e o Coordenador Geral, por delegação do Director do Instituto, decidir sobre a justificação da falta desde a aplicação dos artigos 16º e 17º."},{"t":"Artigo 23.º - Reprovação por faltas","x":"Perdem frequência a disciplina, reprovando a mesma e não tendo acesso ao exame em atraso, os estudantes que perfizerem um total de o duplo dos tempos que lesiona cada disciplina de forma injustificadas ou triplo de faltas justificadas dos tempos que lesiona cada disciplina no período que avalia-se."}]},{"t":"Secção IV - Regime de Avaliação","a":[{"t":"Regime de avaliação","x":"O regime de avaliação no IPPS é baseando-se no REGIME DE AVALIAÇÃO DOS ALUNOS DA FORMAÇÃO MÉDIA TÉCNICA, sendo este de obrigatório cumprimento, já que em ele estabelecem-se normas que permitem o alcance dos objectivos previstos no ensino o qual deverá cumprir com o estabelecido na Secção III sobre Classificação final e condições de transição, nos Artigos 18º até 21º do referido regulamento."},{"t":"Art.º 18.º - Classificação final da disciplina","x":"1- A classificação final de uma disciplina (CFD) terá de ser maior ou igual a 10 valores. O aluno, no ano terminal da disciplina, terá de ter no mínimo 7 valores, não podendo ter negativa em dois anos de funcionamento da disciplina."},{"t":"Art.º 19.º - Condição de transição de classe da 10.ª para 11.ª","x":"1- Um aluno transita da 10ª para 11ª classe se tiver classificação anual positivo a todas as disciplinas que integram o plano curricular na 10ª classe, exceptuando no máximo duas, consideram-se positivas as classificações entre 10 e 20 valores, inclusive."},{"t":"Art.º 20.º - Condição de transição de classe: da 11.ª para 12.ª classe","x":"1- Um aluno transita da 11ª para 12ª se tiver classificação anual positiva todas as disciplinas que integram o plano curricular na 11ª classe, exceptuando no máximo duas disciplinas.\n2- Se o aluno tiver negativa em disciplinas terminais da 10ª classe, estas negativas também contam para o máximo de duas disciplinas negativas."},{"t":"Art.º 21.º - Condição de transição de classe: da 12.ª para 13.ª classes","x":"1- Um aluno transita da 12ª para 13ª se tiver classificação anual positiva a todas as disciplinas que integram o plano curricular na 12ª classe, exceptuando no máximo duas disciplinas.\n2- Se o aluno estiver negativa em disciplina terminais da 10ª ou 11ª classes essas negativas também contam para o máximo de duas disciplina negativas. Para contagem de negativas, no caso das disciplinas terminais da 12ª classe, conta a classificação final da disciplina e não a classificação anual."},{"t":"Artigo 24.º - Processo de avaliação","x":"1. Todas as disciplinas dos cursos ministrados no IPPS são da área de administração e serviços, e informática é sujeitas a um processo de avaliação de conhecimentos através do qual determina-se o aproveitamento individual de cada aluno por disciplina tendo em conta os objectivos definidos para cada uma de elas e da classe.\n2. A avaliação de conhecimentos pode revestir as formas de avaliação contínua (A.C), avaliação parcelares (PP) e avaliação final (PT) em cada uns dos trimestres para todas as classes e exame final ao final do ano para a classe de exame, nas modalidades de prova oral, escrita (combinadas) para as disciplinas de línguas; escrita e prática.\na). As formas para a realização da Avaliação Contínua (AC) poderão ser, escritas, orais, participação nas aulas, apresentação de trabalhos, seminários ou outras formas determinadas pólo professor, o qual deverá fazer quatro (4) por trimestre.\nb). A forma para a realização da Avaliação Parcelar (PP), resulta de provas testes realizados em momentos pré-determinados do trimestre, e o numero em cada cadeira será ele estabelecido em suo Plano Calendário;\nc). A forma para a realização da Avaliação Final (PT), do I e II Trimestre tem em vista julgar a consecução pelos estudantes dos objectivos globais do Trimestre na cadeira, resultando da ponderação de provas do trimestre ou outras formas de avaliação adequados a natureza da disciplina, a realizar no fim do I e II trimestre.\nd). A forma para a realização da Avaliação Final (PG), do III Trimestre tem em vista julgar a consecução pelos estudantes e dos objectivos globais do Ano Lectivo na disciplina, resultando da ponderação de Prova do Global ou outras formas de avaliação adequados a natureza da disciplina, a realizar no fim do Ano Lectivo e abarca os seguinte porcentagem dos conteúdos de cada trimestre: I Trimestre 20%, II Trimestre 30% e III Trimestre 50%.\ne). A forma para o cálculo da Media Final da Disciplina (MFD) será feito sumando os resultados dos três trimestres e dividindo o resultado por 3. (MFD= M1T+M2T+M3T/3)\nf). Para a 12ª classe (classe de exame) terá a realização de um Exame Final para todas as disciplinas dos currículos de cada curso, recolhendo conteúdos de todo o ano académico, dois objectivos de cada trimestre, sendo um 20% dos conteúdos I Trimestre, 30% do II Trimestre e 50% do III Trimestre.\ng). A forma para cálculo da Classificação Anual (CA) será feito achando a Media Final da Disciplina (MFD) será feito conforme a 10ª e 11ª, multiplicando este resultado por 0,6 (60%), mais o resulto do Exame Final multiplicado por 0,4 (40%) (CA= MFDx0,6 + Efx0,4)\nA utilização da forma de avaliação final é obrigatória e é escrita ou oral e/prática. Quer a avaliação final se faça por provas finais de exame quer pela apresentação de trabalhos ou de outras formas de avaliação adequadas á natureza das disciplinas poderá ainda ser determinada a realização de uma prova oral de acordo com os objectivos da disciplina.\nPara as disciplinas que sua avaliação esta composta por uma parte prática e uma escrita é um requisito a aprovação da prática para a presentação da teórica, sendo o requisito a aprovação de ambas para estar aprovado na disciplina.\nModalidades de correcção da Prova escrita. A prova escrita será corrigida por os de professores das disciplinas nas turmas nas que lesionam, o acto de correição será efectuado na Instituição, nas salas indicadas pela direcção pedagógica.\n3. Avaliação dos alunos da 13ª classe (finalistas) é composto por três dimensões:\na). A Avaliação do apreveitamento do Estágio Curricular supervisionado: que se componhe (Assistência, pontualidade, nível de aproveitamento, irresponsabilidade...)\nb). Avaliação dos Trabalhos Finais de Curso: O qual será realizado atraves de um Projecto de Investigação (TFC), definidas suas normas desde a disciplina de Projecto Tecnológico, o qual consiste na realização do processo investigativo na área de Estágio com seu devido informe escrito, seguido da presentação e defesa do mesmo perante um corpo de jurado integrado por um presidente, um secretário, um ou dos voga-lhes e o orientador do grupo.\nc). Participação no processo de investigação e seguimento nas orientações do TFC: Quem não alcançar o 75% de assistência aos encontros com o Orientador, implicará a perda do direito para participar da presentação e defesa do mesmo, resultando reprovado."},{"t":"Artigo 25.º - Aplicação dos exames","x":"Para o ato de realização das provas se deverão cumprir com o seguinte:\na) Para o acto da cobertura os professores que realizam júri, deverão estar na Instituição as 07h30 (30 minutos antes da hora marcada para o início dos exames) em função da arrumação do processo. Quem chegar fora do período indicado será condicionado ao acto de Júri.\nb) Para o acto de realização das provas, os alunos deverão estar na Instituição as 07h30 (30 minutos antes da hora marcada para o início dos exames 08h e 13h) em função da arrumação do processo.\nc) Quem chegar passada as 08h pontualmente, (hora de início das Provas), será considerado como falta e condicionado a realizar das provas do calendário no dia.\nd) A organização dos estudantes nas salas de aula será feita pelo júri, sendo os responsáveis pela organização, disciplina e limpeza das salas perante o acto de realização do exame.\ne) Os Professores dos júris, durante o acto dos exames se manterão de pé, em frente ou no final da sala de aula, garantindo que cada aluno só leve lápis, esferográfica e borracha, meios de medição para o exame de matemática. Não se permitem calculadoras, agendas electrónicas, telefones celulares ou similares, assim como rascunhos o uso de folhas que não sejam a da prova."}]},{"t":"Regime Disciplinar","a":[{"t":"Artigo 42.º - Expulsão da Instituição","x":"1. A expulsão da Instituição consiste na proibição do acesso ao espaço escolar e na retenção do infractor, no ano de escolaridade que frequenta quando a medida é aplicada, impedindo-o de se matricular nesse ano lectivo em qualquer outro estabelecimento de ensino privado.\n2. A medida disciplinar de expulsão da Instituição só pode ocorrer perante um comportamento do infractor que perturbe gravemente o funcionamento normal das actividades da escola ou as relações no âmbito da comunidade educativa, constituinte de uma infracção disciplinar muito grave, quando reconhecidamente se constate não haver outro modo de procurar responsabilizá-lo no sentido do cumprimento dos seus deveres como infractor."}]}];

function fluxo(m,nominal,provas){
const titulo=nominal?"Relação nominal":(provas?"Horário das provas":"Horários");

m.innerHTML=`<h1>${titulo}</h1><p class="lead">Escolhe o teu curso${nominal?' ou pesquisa o teu nome':''}.</p><div class="list" id="l"></div>`;

if(!S.periodo){
m.innerHTML=`<h1>${esc(S.curso)}</h1><p class="lead">Escolhe o teu período.</p><div class="periods" id="l"></div>`;
PERIODOS.filter(p=>!provas||(PROVAS[S.curso]||{})[p]).forEach(p=>$('l').appendChild(opt(p,()=>go({curso:S.curso,periodo:p}))));return}
if(!S.classe){
m.innerHTML=`<h1>${esc(S.periodo)}</h1><p class="lead">${esc(S.curso)}. Escolhe a tua classe.</p><div class="periods" id="l"></div>`;
CLASSES.filter(k=>!provas||((PROVAS[S.curso]||{})[S.periodo]||{})[k]).forEach(k=>$('l').appendChild(opt(kl(k),()=>go({curso:S.curso,periodo:S.periodo,classe:k}))));return}
const H=get(),turmas=(nominal?[...new Set([...Object.keys(H),...Object.keys(nom())])]:provas?[...new Set([...Object.keys(H),...Object.keys(prv())])]:Object.keys(H)).sort();
if(!S.turma){
m.innerHTML=`<h1>${esc(kl(S.classe))}</h1><p class="lead">${esc(S.curso)}, ${esc(S.periodo)}. Escolhe a tua turma.</p>`;
if(!turmas.length){m.innerHTML+=`<p class="empty">${nominal?'A relação nominal desta classe ainda não foi publicada.':provas?'O horário das provas desta classe ainda não foi publicado.':'Os horários desta classe ainda não foram publicados.'} Volta a consultar em breve.</p>`;return}
m.innerHTML+='<input type="search" id="q" placeholder="Pesquisar turma" aria-label="Pesquisar turma"><div class="list" id="l"></div>';
const draw=()=>{const t=norm($('q').value.trim());$('l').innerHTML="";

f.forEach(x=>$('l').appendChild(opt('Turma '+x,()=>go({...S,turma:x}))))};

const draw=()=>{const t=norm($('rq').value.trim()).split(/\s+/).filter(Boolean),f=t.length>0;

if(f&&!as.length)return'';
return `<details class="cap"${f?' open':''}><summary>${esc(c.t)}</summary>${as.map(x=>`<div class="art"><b>${esc(x.t)}</b><p>${esc(x.x)}</p></div>`).join("")}</details>`}).join("");

function lista(m){

if(!L.length){m.innerHTML=h+'<p class="empty">A relação nominal desta turma ainda não foi publicada.</p>';return}
